{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "fraud-copilot.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Backend API — everything under /api/v1 (see backend/main.py API_PREFIX)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port: { number: 8000 }
          # Backend health check (kept at root for infra probes)
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port: { number: 8000 }
          # Frontend — everything else (pages + Next.js /api/auth, /api/psr-pack)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port: { number: 3000 }
{{- end }}
